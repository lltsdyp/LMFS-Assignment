[project]
name = "lmfs-assignment1"
version = "0.1.0"
description = "LMFS Assignment 1: BPE and Transformer"
requires-python = ">=3.13,<3.14"
dependencies = [
    "lmfs-bpe-native",
    "numpy",
    "regex==2026.9.10",
    "torch",
    "wandb==0.30.0",
    "pytest",
]

[dependency-groups]
dev = [
    "black",
    "pylint",
]

[tool.black]
line-length = 80
target-version = ["py313"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.main]
extension-pkg-allow-list = ["_lmfs_bpe"]

[tool.uv]
package = false
python-preference = "managed"

[tool.uv.sources]
lmfs-bpe-native = { path = "rust", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
